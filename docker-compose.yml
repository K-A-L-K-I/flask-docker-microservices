# ══════════════════════════════════════════════════════════════
# Docker Compose - Cloud Task Manager Microservices
# 
# Architecture:
#   Client → Nginx (port 80) → Flask API (port 5000) → MySQL (port 3306)
#
# Usage:
#   docker-compose up --build        # Build and start all services
#   docker-compose down              # Stop all services
#   docker-compose down -v           # Stop and remove volumes (reset DB)
#   docker-compose logs -f api       # Stream API logs
#   docker-compose ps                # Check service status
# ══════════════════════════════════════════════════════════════

version: '3.8'

services:

  # ──────────── MySQL Database ────────────
  db:
    image: mysql:8.0
    container_name: taskmanager-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass123
    ports:
      - "3307:3306"    # Mapped to 3307 to avoid conflicts
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────── Flask API Backend ────────────
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: taskmanager-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: taskuser
      DB_PASSWORD: taskpass123
      DB_NAME: taskmanager
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    # No port exposed externally — only accessible via Nginx

  # ──────────── Nginx Reverse Proxy ────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: taskmanager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

# ──────────── Shared Network ────────────
networks:
  app-network:
    driver: bridge
    name: taskmanager-network

# ──────────── Persistent Volume ────────────
volumes:
  mysql_data:
    name: taskmanager-mysql-data
