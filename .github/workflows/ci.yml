name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Deploy & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/app.py --max-line-length=120 --count --show-source --statistics

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check container status
        run: docker compose ps

      - name: Health check
        run: |
          curl -f http://localhost/api/health || (docker compose logs api && exit 1)

      - name: Test API endpoints
        run: |
          echo "GET /api/tasks"
          curl -sf http://localhost/api/tasks | python3 -m json.tool

          echo "GET /api/stats"
          curl -sf http://localhost/api/stats | python3 -m json.tool

          echo "POST /api/tasks"
          curl -sf -X POST http://localhost/api/tasks \
            -H "Content-Type: application/json" \
            -d '{"title":"CI/CD Test Task","description":"Created by GitHub Actions","priority":"high"}' \
            | python3 -m json.tool

          echo "GET /api/tasks (verify creation)"
          curl -sf http://localhost/api/tasks | python3 -m json.tool

          echo "PUT /api/tasks/6"
          curl -sf -X PUT http://localhost/api/tasks/6 \
            -H "Content-Type: application/json" \
            -d '{"status":"completed"}' \
            | python3 -m json.tool

          echo "DELETE /api/tasks/6"
          curl -sf -X DELETE http://localhost/api/tasks/6 \
            | python3 -m json.tool

          echo "All API tests passed"

      - name: Cleanup
        if: always()
        run: docker compose down -v
