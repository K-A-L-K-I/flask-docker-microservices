<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Task Manager | Docker Microservices Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           Design System - CSS Custom Properties
           ═══════════════════════════════════════════ */
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-card: #21242f;
            --bg-card-hover: #282c3a;
            --border: #2d3142;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0b0;
            --text-muted: #6b7185;
            --accent-blue: #4f8ff7;
            --accent-green: #34d399;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a78bfa;
            --gradient-1: linear-gradient(135deg, #4f8ff7 0%, #a78bfa 100%);
            --gradient-2: linear-gradient(135deg, #34d399 0%, #4f8ff7 100%);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px rgba(79,143,247,0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ═══════════════════════════════════════════
           Reset & Base
           ═══════════════════════════════════════════ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ═══════════════════════════════════════════
           Header
           ═══════════════════════════════════════════ */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: var(--gradient-1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: var(--shadow-glow);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .header-badge .dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ═══════════════════════════════════════════
           Main Container
           ═══════════════════════════════════════════ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ═══════════════════════════════════════════
           Stats Cards
           ═══════════════════════════════════════════ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .stat-card:nth-child(1)::before { background: var(--gradient-1); }
        .stat-card:nth-child(2)::before { background: var(--accent-orange); }
        .stat-card:nth-child(3)::before { background: var(--accent-blue); }
        .stat-card:nth-child(4)::before { background: var(--accent-green); }
        .stat-card:nth-child(5)::before { background: var(--accent-red); }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
            box-shadow: var(--shadow-glow);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ═══════════════════════════════════════════
           Controls
           ═══════════════════════════════════════════ */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            background: var(--bg-card-hover);
        }

        .btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-primary {
            background: var(--gradient-1);
            border: none;
            color: #fff;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: var(--shadow-glow);
        }

        /* ═══════════════════════════════════════════
           Task Cards
           ═══════════════════════════════════════════ */
        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: var(--transition);
            animation: fadeSlideIn 0.4s ease-out forwards;
            opacity: 0;
        }

        .task-card:hover {
            border-color: var(--accent-blue);
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-sm);
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-priority {
            width: 4px;
            height: 40px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .priority-high { background: var(--accent-red); }
        .priority-medium { background: var(--accent-orange); }
        .priority-low { background: var(--accent-green); }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .task-desc {
            color: var(--text-secondary);
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-in_progress {
            background: rgba(79, 143, 247, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(79, 143, 247, 0.3);
        }

        .status-completed {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .task-actions {
            display: flex;
            gap: 0.4rem;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .icon-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(79, 143, 247, 0.1);
        }

        .icon-btn.delete:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        /* ═══════════════════════════════════════════
           Modal
           ═══════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-md);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h2 {
            font-size: 1.15rem;
            margin-bottom: 1.5rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(79, 143, 247, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        /* ═══════════════════════════════════════════
           Architecture Section
           ═══════════════════════════════════════════ */
        .arch-section {
            margin-top: 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
        }

        .arch-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .arch-diagram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            padding: 1.5rem 0;
        }

        .arch-node {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            text-align: center;
            min-width: 140px;
            transition: var(--transition);
        }

        .arch-node:hover {
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }

        .arch-node-icon {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .arch-node-label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }

        .arch-node-tech {
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        .arch-arrow {
            color: var(--accent-blue);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* ═══════════════════════════════════════════
           Empty State
           ═══════════════════════════════════════════ */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* ═══════════════════════════════════════════
           Responsive
           ═══════════════════════════════════════════ */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { padding: 1rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; align-items: stretch; }
            .task-card { flex-direction: column; align-items: stretch; }
            .task-meta { justify-content: space-between; }
            .arch-diagram { flex-direction: column; }
            .arch-arrow { transform: rotate(90deg); }
        }
    </style>
</head>
<body>

    <!-- ═══════════ Header ═══════════ -->
    <header class="header">
        <div class="header-left">
            <div class="logo">☁️</div>
            <h1>Cloud Task Manager</h1>
        </div>
        <div class="header-badge">
            <span class="dot"></span>
            All Services Running
        </div>
    </header>

    <!-- ═══════════ Main Content ═══════════ -->
    <main class="container">

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Tasks</div>
                <div class="stat-value" id="statTotal">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="statPending">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">In Progress</div>
                <div class="stat-value" id="statProgress">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="statCompleted">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">High Priority</div>
                <div class="stat-value" id="statHigh">-</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <h2 class="section-title">📋 Tasks</h2>
            <div class="btn-group">
                <button class="btn active" onclick="filterTasks('all')">All</button>
                <button class="btn" onclick="filterTasks('pending')">Pending</button>
                <button class="btn" onclick="filterTasks('in_progress')">In Progress</button>
                <button class="btn" onclick="filterTasks('completed')">Completed</button>
                <button class="btn btn-primary" onclick="openModal()">+ New Task</button>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="tasks-list" id="tasksList">
            <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <p>Loading tasks...</p>
            </div>
        </div>

        <!-- Architecture Diagram -->
        <div class="arch-section">
            <div class="arch-title">🏗️ Microservices Architecture</div>
            <div class="arch-diagram">
                <div class="arch-node">
                    <div class="arch-node-icon">🌐</div>
                    <div class="arch-node-label">Client</div>
                    <div class="arch-node-tech">Browser</div>
                </div>
                <div class="arch-arrow">→</div>
                <div class="arch-node">
                    <div class="arch-node-icon">⚡</div>
                    <div class="arch-node-label">Nginx</div>
                    <div class="arch-node-tech">Reverse Proxy</div>
                </div>
                <div class="arch-arrow">→</div>
                <div class="arch-node">
                    <div class="arch-node-icon">🐍</div>
                    <div class="arch-node-label">Flask API</div>
                    <div class="arch-node-tech">Python + Gunicorn</div>
                </div>
                <div class="arch-arrow">→</div>
                <div class="arch-node">
                    <div class="arch-node-icon">🗄️</div>
                    <div class="arch-node-label">MySQL</div>
                    <div class="arch-node-tech">Database</div>
                </div>
            </div>
        </div>

    </main>

    <!-- ═══════════ Modal ═══════════ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">➕ Create New Task</h2>
            <form id="taskForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitleInput">Title *</label>
                    <input type="text" id="taskTitleInput" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <textarea id="taskDesc" placeholder="Enter task description"></textarea>
                </div>
                <div class="form-group">
                    <label for="taskStatus">Status</label>
                    <select id="taskStatus">
                        <option value="pending">Pending</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══════════ JavaScript ═══════════ -->
    <script>
        // API base URL — proxied through Nginx
        const API_BASE = '/api';
        let currentFilter = 'all';

        // ─────────── Fetch & Render Stats ───────────
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statTotal').textContent = data.stats.total || 0;
                    document.getElementById('statPending').textContent = data.stats.pending || 0;
                    document.getElementById('statProgress').textContent = data.stats.in_progress || 0;
                    document.getElementById('statCompleted').textContent = data.stats.completed || 0;
                    document.getElementById('statHigh').textContent = data.stats.high_priority || 0;
                }
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        // ─────────── Fetch & Render Tasks ───────────
        async function loadTasks(status = null) {
            try {
                const url = status && status !== 'all' 
                    ? `${API_BASE}/tasks?status=${status}` 
                    : `${API_BASE}/tasks`;
                const res = await fetch(url);
                const data = await res.json();
                renderTasks(data.tasks || []);
            } catch (err) {
                document.getElementById('tasksList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Failed to connect to API. Make sure all containers are running.</p>
                        <p style="font-size:0.8rem;margin-top:0.5rem;color:var(--text-muted)">
                            Run: docker-compose up --build
                        </p>
                    </div>`;
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksList');
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No tasks found. Create your first task!</p>
                    </div>`;
                return;
            }

            container.innerHTML = tasks.map((task, i) => `
                <div class="task-card" style="animation-delay: ${i * 0.05}s">
                    <div class="task-priority priority-${task.priority}"></div>
                    <div class="task-info">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-desc">${escapeHtml(task.description || 'No description')}</div>
                    </div>
                    <div class="task-meta">
                        <span class="status-badge status-${task.status}">
                            ${task.status.replace('_', ' ')}
                        </span>
                        <div class="task-actions">
                            <button class="icon-btn" onclick="editTask(${task.id})" title="Edit">✏️</button>
                            <button class="icon-btn delete" onclick="deleteTask(${task.id})" title="Delete">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ─────────── Filter ───────────
        function filterTasks(status) {
            currentFilter = status;
            document.querySelectorAll('.btn-group .btn:not(.btn-primary)').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.trim().toLowerCase().replace(' ', '_') === status || 
                    (status === 'all' && btn.textContent.trim() === 'All'));
            });
            loadTasks(status);
        }

        // ─────────── Modal ───────────
        function openModal(task = null) {
            document.getElementById('modalOverlay').classList.add('active');
            if (task) {
                document.getElementById('modalTitle').textContent = '✏️ Edit Task';
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitleInput').value = task.title;
                document.getElementById('taskDesc').value = task.description || '';
                document.getElementById('taskStatus').value = task.status;
                document.getElementById('taskPriority').value = task.priority;
            } else {
                document.getElementById('modalTitle').textContent = '➕ Create New Task';
                document.getElementById('taskForm').reset();
                document.getElementById('taskId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ─────────── Create / Update ───────────
        async function handleSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const payload = {
                title: document.getElementById('taskTitleInput').value,
                description: document.getElementById('taskDesc').value,
                status: document.getElementById('taskStatus').value,
                priority: document.getElementById('taskPriority').value
            };

            try {
                const url = id ? `${API_BASE}/tasks/${id}` : `${API_BASE}/tasks`;
                const method = id ? 'PUT' : 'POST';
                await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeModal();
                loadTasks(currentFilter);
                loadStats();
            } catch (err) {
                alert('Failed to save task. Check API connection.');
            }
        }

        // ─────────── Edit ───────────
        async function editTask(id) {
            try {
                const res = await fetch(`${API_BASE}/tasks/${id}`);
                const data = await res.json();
                if (data.success) openModal(data.task);
            } catch (err) {
                alert('Failed to load task.');
            }
        }

        // ─────────── Delete ───────────
        async function deleteTask(id) {
            if (!confirm('Delete this task?')) return;
            try {
                await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE' });
                loadTasks(currentFilter);
                loadStats();
            } catch (err) {
                alert('Failed to delete task.');
            }
        }

        // ─────────── Utility ───────────
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─────────── Close modal on outside click ───────────
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ─────────── Init ───────────
        loadStats();
        loadTasks();
    </script>

</body>
</html>
